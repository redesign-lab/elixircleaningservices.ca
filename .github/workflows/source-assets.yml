name: Retrieve source assets
on:
  push:
    branches: [arena/61404d78-elixircleaningservices-ca]
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve public homepage and images
        shell: bash
        run: |
          mkdir source-assets
          curl -fsSL 'https://elixircleaningservices.ca/' -o source-assets/home.html
          base='https://elixircleaningservices.ca/wp-content/uploads/2023/12'
          for file in untitled-design-2-e1702833797734.png fred-kleber-7dxe4fizyeu-unsplash-edited.jpg pexels-tima-miroshnichenko-6195104.jpg pexels-cottonbro-studio-8273523.jpg pexels-tima-miroshnichenko-6195274.jpg pexels-cottonbro-studio-4107286-e1702835854366.jpg pexels-photo-7746574-1.jpeg; do curl -fLsS "$base/$file" -o "source-assets/$file" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: source-assets
          path: source-assets/
