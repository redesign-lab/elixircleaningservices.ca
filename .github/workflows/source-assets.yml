name: Retrieve source assets
on:
  push:
    branches: [arena/61404d78-elixircleaningservices-ca]
permissions:
  contents: write
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/61404d78-elixircleaningservices-ca
      - name: Retrieve public homepage and images
        shell: bash
        run: |
          mkdir -p source-research
          curl -fsSL 'https://elixircleaningservices.ca/' -o source-research/home.html
          base='https://elixircleaningservices.ca/wp-content/uploads/2023/12'
          for file in untitled-design-2-e1702833797734.png fred-kleber-7dxe4fizyeu-unsplash-edited.jpg pexels-tima-miroshnichenko-6195104.jpg pexels-cottonbro-studio-8273523.jpg pexels-tima-miroshnichenko-6195274.jpg pexels-cottonbro-studio-4107286-e1702835854366.jpg pexels-photo-7746574-1.jpeg; do curl -fLsS "$base/$file" -o "source-research/$file" || true; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-research
          git diff --cached --quiet || git commit -m 'Retrieve original source assets'
          git push origin HEAD:arena/61404d78-elixircleaningservices-ca
